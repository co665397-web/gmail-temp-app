<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-slate-100 font-sans flex flex-col">

    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 p-2.5 rounded-xl shadow-lg shadow-red-600/30">
                    <i class="fa-solid fa-envelope-open-text text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white">TempMail Cloud</h1>
                    <p class="text-[11px] text-slate-400">Hệ thống nhận mã OTP & Đăng ký tự động</p>
                </div>
            </div>
            <div class="text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                Đang hoạt động 24/7
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-5 space-y-6">
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl p-5 shadow-xl border border-slate-700/50">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-red-500"></i> Địa chỉ Email Ẩn Danh Của Bạn
                </h2>
                <div class="flex items-center gap-2 mb-3">
                    <input type="text" id="emailInput" readonly 
                           class="w-full bg-slate-900/90 text-red-400 font-mono font-semibold text-xs px-3.5 py-3 rounded-xl border border-slate-700 focus:outline-none select-all shadow-inner" 
                           value="Đang kết nối...">
                    <button onclick="copyEmail()" title="Sao chép"
                            class="bg-red-600 hover:bg-red-500 text-white p-3 rounded-xl font-medium transition shadow-lg shadow-red-600/20 flex items-center justify-center min-w-[44px]">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <button onclick="changeEmailAlias()" 
                        class="w-full bg-slate-700/60 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 border border-slate-600/50 shadow-sm group">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400 group-hover:rotate-12 transition-transform"></i> Tạo email ngẫu nhiên mới ngay
                </button>
            </div>

            <div class="bg-slate-800/60 backdrop-blur rounded-2xl p-5 shadow-xl border border-slate-700/50 flex items-center justify-between">
                <div>
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Đồng bộ tự động</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Làm mới sau <span id="timerText" class="font-bold text-red-400">5</span> giây</p>
                </div>
                <button onclick="checkMessages(true)" 
                        class="bg-slate-700/60 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-xl transition border border-slate-600/50 flex items-center gap-2">
                    <i class="fa-solid fa-rotate" id="refreshIcon"></i> Quét ngay
                </button>
            </div>
        </div>

        <div class="md:col-span-7 space-y-6">
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl shadow-xl border border-slate-700/50 overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-700/50 flex justify-between items-center bg-slate-800/40">
                    <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-inbox text-red-500"></i> Hộp Thư Đến 
                        <span id="msgCount" class="bg-red-500/20 text-red-400 text-xs font-bold px-2.5 py-0.5 rounded-full border border-red-500/30">0</span>
                    </h2>
                </div>
                <div id="messagesList" class="divide-y divide
