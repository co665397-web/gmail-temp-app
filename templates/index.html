<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMOS Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 font-sans flex items-center justify-center p-4">

    <div class="max-w-lg w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 space-y-6">
        <div class="flex items-center space-x-3 border-b border-slate-700 pb-4">
            <div class="bg-red-600 p-3 rounded-xl shadow-lg">
                <i class="fa-solid fa-robot text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-white">Trạm Điều Khởi VMOS Automation</h1>
                <p class="text-xs text-slate-400">Tự động lấy email từ Render & Điều khiển trình duyệt</p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Đường dẫn trang VMOS mục tiêu:</label>
                <input type="text" id="targetUrl" value="https://www.vmoscloud.com/" 
                       class="w-full bg-slate-900 text-xs px-3.5 py-3 rounded-xl border border-slate-700 text-slate-200 focus:outline-none">
            </div>

            <button onclick="startAutomation()" id="startBtn"
                    class="w-full bg-red-600 hover:bg-red-500 text-white text-xs font-semibold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Bắt đầu tiến trình tự động
            </button>
        </div>

        <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs text-slate-400">Email hiện tại:</span>
                <span id="currentEmail" class="text-xs font-mono text-red-400 font-semibold">---</span>
            </div>
            <div>
                <span class="text-xs text-slate-400 block mb-1">Nhật ký hoạt động (Logs):</span>
                <div id="logBox" class="bg-slate-950 p-3 rounded-lg text-xs font-mono text-emerald-400 h-28 overflow-y-auto border border-slate-800">
                    Đang chờ khởi chạy...
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setInterval(fetchStatus, 2000);
        });

        async function startAutomation() {
            let url = document.getElementById('targetUrl').value;
            let res = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            let data = await res.json();
            alert(data.message);
        }

        async function fetchStatus() {
            try {
                let res = await fetch('/api/status');
                let data = await res.json();
                document.getElementById('currentEmail').innerText = data.email || "---";
                let logBox = document.getElementById('logBox');
                if(logBox.innerText !== data.log) {
                    logBox.innerText = data.log;
                    logBox.scrollTop = logBox.scrollHeight;
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
