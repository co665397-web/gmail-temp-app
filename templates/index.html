<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tự Động VMOS Cloud</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --bg-header: #111827;
            --accent: #2563eb;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #1f293d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
        }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .machine-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .screen-preview {
            background: #000;
            border-radius: 8px;
            height: 100px;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 12px;
            border: 1px solid #222;
        }
        .add-machine-card {
            background: var(--bg-card);
            border: 1px dashed #374151;
            border-radius: 12px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-machine-card:hover { border-color: var(--accent); }
        .plus-circle {
            width: 45px; height: 45px; background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; margin-bottom: 8px;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border); width: 90%; max-width: 400px;
            padding: 20px; border-radius: 12px; position: relative;
        }
        .close-modal { position: absolute; top: 12px; right: 15px; cursor: pointer; color: var::text-sub; font-size: 18px; }
        select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        select { background: var(--bg-main); color: white; }
        .action-btn { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; }
        .log-container {
            background: #030712; padding: 10px; border-radius: 6px; font-family: monospace;
            font-size: 12px; color: #38bdf8; max-height: 130px; overflow-y: auto; margin-top: 10px; display: none;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold;">Meows Cloud Automation</div>
        <div style="background: #1f293d; padding: 4px 12px; border-radius: 20px; font-size: 13px; color: #fbbf24;">🪙 1025 Coin</div>
    </header>

    <div class="container">
        <h3>Quản Lý Máy Ảo Tự Động</h3>
        <div class="grid" id="machineGrid">
            <div class="add-machine-card" onclick="openModal()">
                <div class="plus-circle">+</div>
                <div style="font-weight: 500; font-size: 14px;">Nhận Máy Free (Auto)</div>
            </div>
        </div>
    </div>

    <div class="modal" id="vmosModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 style="margin-top: 0;">Trình Tự Động Hóa</h3>
            <p style="font-size: 13px; color: var(--text-sub);">Hệ thống sẽ mở trình duyệt ngầm truy cập VMOS:</p>
            
            <select id="cloudSelect">
                <option value="vmos">VMOS Cloud</option>
            </select>

            <button class="action-btn" id="claimBtn" onclick="runAutomation()">Bắt đầu chạy Auto</button>
            
            <div id="logBox" class="log-container"></div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('vmosModal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('vmosModal').style.display = 'none';
            document.getElementById('logBox').style.display = 'none';
            document.getElementById('logBox').innerHTML = '';
        }

        async function runAutomation() {
            const logBox = document.getElementById('logBox');
            const btn = document.getElementById('claimBtn');
            
            logBox.style.display = 'block';
            btn.disabled = true;
            logBox.innerHTML = 'Đang khởi động trình duyệt tự động...<br>';

            try {
                let res = await fetch('/api/auto-claim-vmos', { method: 'POST' });
                let data = await res.json();

                logBox.innerHTML += `Đã mở trang web thành công!<br>`;
                await new Promise(r => setTimeout(r, 1000));
                logBox.innerHTML += `Đã tạo email: <span style="color:#fbbf24">${data.email}</span><br>`;
                await new Promise(r => setTimeout(r, 1000));
                logBox.innerHTML += '<span style="color: #4ade80;">✔ Hoàn tất! Đã nhận máy về tài khoản.</span>';

                setTimeout(() => {
                    closeModal();
                    location.reload();
                }, 1500);

            } catch (err) {
                logBox.innerHTML += '<span style="color: #f87171;">❌ Lỗi thực thi tự động hóa!</span>';
            } finally {
                btn.disabled = false;
            }
        }

        window.onload = async function() {
            let res = await fetch('/api/get-machines');
            let data = await res.json();
            let grid = document.getElementById('machineGrid');
            
            data.machines.forEach(m => {
                let card = document.createElement('div');
                card.className = 'machine-item';
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub);">
                        <span><b>${m.name}</b> (${m.region})</span>
                        <span style="color: #38bdf8;">${m.version}</span>
                    </div>
                    <div class="screen-preview">📱 Android VMOS Cloud</div>
                    <div style="font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between;">
                        <span>Còn lại: <b style="color: #4ade80;">${m.time_left}</b></span>
                        <span style="cursor:pointer; color: #38bdf8;" onclick="navigator.clipboard.writeText('${m.share}')">Copy Share</span>
                    </div>
                `;
                grid.insertBefore(card, grid.firstChild);
            });
        }
    </script>
</body>
</html>
