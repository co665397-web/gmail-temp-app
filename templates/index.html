<script>
        // Đặt mặc định đếm ngược là 5 giây
        let countdown = 5;
        let autoRefreshTimer = null;
        let activeMsgId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchEmail();
            checkMessages(true);
            startAutoRefresh();
        });

        async function fetchEmail() {
            try {
                const res = await fetch('/api/get-email');
                const data = await res.json();
                document.getElementById('emailInput').value = data.email;
            } catch (err) {
                console.error(err);
            }
        }

        async function changeEmailAlias() {
            try {
                const res = await fetch('/api/change-email', { method: 'POST' });
                const data = await res.json();
                document.getElementById('emailInput').value = data.email;
                showToast("Đã đổi sang email mới thành công!");
                closeDetail();
                checkMessages(false);
            } catch (err) {
                showToast("Lỗi đổi email!");
            }
        }

        function copyEmail() {
            navigator.clipboard.writeText(document.getElementById('emailInput').value);
            showToast("Đã sao chép email!");
        }

        async function checkMessages(showLoading = false) {
            const listContainer = document.getElementById('messagesList');
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('fa-spin');

            if (showLoading && listContainer) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl text-red-500 mb-2"></i><p class="text-xs">Đang quét thư...</p></div>`;
            }

            try {
                const res = await fetch('/api/messages');
                const messages = await res.json();
                const msgCountElem = document.getElementById('msgCount');
                if (msgCountElem) msgCountElem.innerText = messages.length;

                if (listContainer) {
                    if (messages.length === 0) {
                        listContainer.innerHTML = `<div class="p-8 text-center text-slate-400"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><p class="text-xs">Hộp thư trống.</p></div>`;
                    } else {
                        listContainer.innerHTML = '';
                        messages.forEach(msg => {
                            const item = document.createElement('div');
                            item.className = `p-3.5 hover:bg-slate-50 cursor-pointer transition flex justify-between items-center ${activeMsgId === msg.id ? 'bg-red-50/60 border-l-4 border-red-600' : ''}`;
                            item.onclick = () => readMessage(msg.id, msg.subject, msg.from);
                            item.innerHTML = `
                                <div class="overflow-hidden pr-2">
                                    <p class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(msg.from)}</p>
                                    <p class="text-xs text-slate-600 truncate font-medium mt-0.5">${escapeHtml(msg.subject)}</p>
                                </div>
                                <span class="text-[10px] text-slate-400 whitespace-nowrap">${msg.date ? msg.date.slice(0, 16) : ''}</span>
                            `;
                            listContainer.appendChild(item);
                        });
                    }
                }
            } catch (err) {
                console.error(err);
            } finally { 
                if (refreshIcon) refreshIcon.classList.remove('fa-spin'); 
            }
        }

        async function readMessage(id, subject, from) {
            activeMsgId = id;
            document.getElementById('detailBox').classList.remove('hidden');
            document.getElementById('detailSubject').innerText = subject;
            document.getElementById('detailFrom').innerText = from;
            document.getElementById('mailContentBox').value = "Đang tải nội dung văn bản...";
            checkMessages(false);

            try {
                const res = await fetch(`/api/read?id=${id}`);
                const data = await res.json();
                document.getElementById('mailContentBox').value = data.rawText || "Không có nội dung";
            } catch (err) { 
                document.getElementById('mailContentBox').value = "Lỗi tải nội dung thư!";
            }
        }

        function closeDetail() {
            document.getElementById('detailBox').classList.add('hidden');
            activeMsgId = null;
        }

        function startAutoRefresh() {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                countdown--;
                const timerText = document.getElementById('timerText');
                if (timerText) timerText.innerText = countdown;
                if (countdown <= 0) { 
                    countdown = 5; 
                    checkMessages(false); 
                }
            }, 1000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (toast && toastMsg) {
                toastMsg.innerText = message;
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
