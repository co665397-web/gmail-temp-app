<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail IMAP Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col">

    <header class="bg-red-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-brands fa-google text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">Gmail IMAP Reader</h1>
            </div>
            <div class="text-xs bg-red-700 text-red-200 px-3 py-1.5 rounded-full flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                Connected
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-5 space-y-6">
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-at text-red-500"></i> Địa chỉ Email Nhận Thư
                </h2>
                <div class="flex items-center gap-2 mb-3">
                    <input type="text" id="emailInput" readonly 
                           class="w-full bg-slate-50 text-slate-800 font-mono font-medium text-sm px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none select-all" 
                           value="Đang kết nối...">
                    <button onclick="copyEmail()" title="Sao chép"
                            class="bg-red-600 hover:bg-red-700 text-white p-2.5 rounded-lg font-medium transition flex items-center justify-center min-w-[42px]">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <button onclick="changeEmailAlias()" 
                        class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2 border border-slate-200">
                    <i class="fa-solid fa-shuffle text-red-500"></i> Đổi email mới (Không trùng)
                </button>
            </div>

            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-semibold text-slate-700">Tự động làm mới</h3>
                    <!-- Đã đổi hiển thị thành 5s -->
                    <p class="text-xs text-slate-500">Kiểm tra thư sau <span id="timerText" class="font-bold text-red-600">5</span>s</p>
                </div>
                <button onclick="checkMessages(true)" 
                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate" id="refreshIcon"></i> Làm mới
                </button>
            </div>
        </div>

        <div class="md:col-span-7 space-y-6">
            <div
